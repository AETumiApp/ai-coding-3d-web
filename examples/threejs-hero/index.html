<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AETumi · Premium 3D Web Hero (Three.js reference)</title>
<meta name="description" content="A runnable premium 3D web reference for Three.js / WebGL built the AETumi way — production lifecycle, adaptive performance, cleanup. AETumi (aetumi.app).">
<style>
  html,body{margin:0;height:100%;background:#07100d;color:#e9f3ee;font:14px/1.5 system-ui,sans-serif;overflow:hidden}
  #c{position:fixed;inset:0;display:block}
  .hud{position:fixed;left:18px;bottom:16px;z-index:2;max-width:min(520px,80vw)}
  .hud b{font-size:15px;letter-spacing:.02em}
  .hud p{margin:4px 0 0;color:#9fb5ab;font-size:12.5px}
  .tag{display:inline-block;margin-bottom:8px;padding:4px 10px;border:1px solid #2f5c4c;border-radius:999px;
       font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#7fe0b5}
  a{color:#7fe0b5}
</style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="hud">
    <span class="tag">AETumi · premium 3D web</span>
    <b>Three.js hero — production reference</b>
    <p>Adaptive DPR, resize handling, pointer parallax, reduced-motion aware, full teardown on unload.
       A minimal but real pattern for AI-assisted 3D web work with Claude Code / Cursor / Codex. — <a href="https://aetumi.app">aetumi.app</a></p>
  </div>

  <script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
  <script type="module">
    import * as THREE from 'three';

    const canvas = document.getElementById('c');
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
    // Adaptive device-pixel-ratio: crisp on desktop, capped so phones don't overheat.
    const DPR = Math.min(window.devicePixelRatio || 1, 2);
    renderer.setPixelRatio(DPR);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#07100d');
    scene.fog = new THREE.Fog('#07100d', 6, 16);

    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
    camera.position.set(0, 0.4, 6);

    // Key + rim lighting for a premium, non-flat read.
    const key = new THREE.DirectionalLight('#eafff5', 2.4); key.position.set(3, 4, 5);
    const rim = new THREE.DirectionalLight('#39d98a', 1.6); rim.position.set(-4, -1, -3);
    scene.add(key, rim, new THREE.AmbientLight('#0e2a20', 1.2));

    // The hero object: a torus knot with a physically-based, slightly metallic material.
    const geo = new THREE.TorusKnotGeometry(1.1, 0.34, 220, 32);
    const mat = new THREE.MeshStandardMaterial({ color: '#8ef0c2', metalness: 0.55, roughness: 0.22 });
    const knot = new THREE.Mesh(geo, mat);
    scene.add(knot);

    // Pointer parallax — cheap interactivity, no orbit-controls dependency.
    const target = { x: 0, y: 0 };
    addEventListener('pointermove', (e) => {
      target.x = (e.clientX / innerWidth - 0.5) * 0.6;
      target.y = (e.clientY / innerHeight - 0.5) * 0.6;
    });

    function resize() {
      const w = innerWidth, h = innerHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    addEventListener('resize', resize);
    resize();

    let raf = 0;
    const clock = new THREE.Clock();
    function frame() {
      raf = requestAnimationFrame(frame);
      const t = clock.getElapsedTime();
      if (!reduce) { knot.rotation.x = t * 0.28; knot.rotation.y = t * 0.36; }
      camera.position.x += (target.x * 2 - camera.position.x) * 0.05;
      camera.position.y += (0.4 + -target.y * 1.2 - camera.position.y) * 0.05;
      camera.lookAt(0, 0, 0);
      renderer.render(scene, camera);
    }
    frame();

    // Full teardown — the discipline that separates a demo from production code.
    addEventListener('beforeunload', () => {
      cancelAnimationFrame(raf);
      geo.dispose(); mat.dispose(); renderer.dispose();
    });
  </script>
</body>
</html>
